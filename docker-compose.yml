services:
  postgres:
    # PostGIS required by migrations (0008_geography). Host 5433 avoids local Postgres on 5432.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rbit
      POSTGRES_PASSWORD: rbit
      POSTGRES_DB: rbit_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbit -d rbit_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

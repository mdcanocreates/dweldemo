services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rbit
      POSTGRES_PASSWORD: rbit
      POSTGRES_DB: rbit_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbit -d rbit_test"]
      interval: 2s
      timeout: 5s
      retries: 30

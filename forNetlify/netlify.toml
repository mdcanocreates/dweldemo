# Dwel Netlify standalone demo — production UI + local fixtures (no AWS API).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DWEL_NETLIFY_DEMO = "true"
  VITE_APP_ENV = "demo"

# No DWEL_API_ORIGIN required. Demo uses in-memory adapters only.
# Do not add production API secrets to this site.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/demo-build.json"
  [headers.values]
    Cache-Control = "no-cache"

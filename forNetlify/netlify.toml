# Dwel Netlify demo — production web build + same-origin /v1 API proxy.
# Site settings (Netlify UI) must also set DWEL_API_ORIGIN before build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Demo chrome only — never invents auth sessions
  VITE_DWEL_NETLIFY_DEMO = "true"
  VITE_APP_ENV = "demo"

# DWEL_API_ORIGIN must be set in Netlify UI / CLI env (no secrets here).
# Example: https://rbit-dev-xxxxx.us-east-2.elb.amazonaws.com
#
# Backend (API host) must also set for magic-link emails:
#   PUBLIC_APP_URL=https://rbitdemo.netlify.app
#   AUTH_EMAIL_ALLOWLIST=info@rbitfinancial.com,mdcano@rbitfinancial.com,addison@rbitfinancial.com,michaelsorge@rbitfinancial.com

# Headers: do not cache HTML/app shell aggressively during demo iteration
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/demo-build.json"
  [headers.values]
    Cache-Control = "no-cache"

# Used only if Netlify UI Base directory is set to `forNetlify`.
# Prefer the repository-root netlify.toml with Base directory LEFT BLANK.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DWEL_NETLIFY_DEMO = "true"
  VITE_APP_ENV = "demo"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/demo-build.json"
  [headers.values]
    Cache-Control = "no-cache"
